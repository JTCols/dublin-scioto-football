<div class="grid-container">
  <div class="grid-header">
    <h2>Website Links</h2>
    <p class="grid-description">Useful links related to Dublin Scioto Football</p>
  </div>
  
  <ag-grid-angular
    class="ag-theme-alpine links-grid"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [rowData]="_linkData"
    [animateRows]="true"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
    domLayout='autoHeight'
  ></ag-grid-angular>
</div>
