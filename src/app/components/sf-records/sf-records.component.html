<h2 class="ds-page-heading">Records & Achievements</h2>

<div class="records-container">
  <div class="records-introduction">
    <p>Below you'll find the historical records for Dublin Scioto Football. These records showcase the achievements of our program since 1995.</p>
  </div>
  
  <div class="iframe-container">
    <div class="loading-overlay" [ngClass]="{'hidden': !isLoading}">
      <div class="spinner"></div>
      <p>Loading records...</p>
    </div>
    <iframe 
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSm3nUkjyx6FiyWzJiIx3sHsp3r5MBrBzDyzcpP-smmT618lfyQ9Yc5VHX78EokVdhG-3flXG4mFY7_/pubhtml?widget=true&amp;headers=false"
      width="100%" 
      height="800px"
      (load)="onIframeLoad()"
      #recordsFrame>
    </iframe>
  </div>
</div>
