<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <rect width="400" height="225" fill="#f5f5f5" />
  
  <!-- Dublin Scioto IRISH logo - simplified version -->
  <g transform="translate(115, 30) scale(0.35)">
    <!-- Top octagonal outline - gray -->
    <path d="M100,0 L300,0 L400,100 L400,200 L300,200 L300,150 L170,150 L170,200 L70,200 L0,130 L0,100 Z" 
          fill="none" stroke="#999999" stroke-width="20" />
    
    <!-- Top S part - green -->
    <path d="M120,20 L280,20 L360,100 L360,180 L280,180 L280,130 L170,130 L170,180 L100,180 L40,120 L40,100 Z" fill="#006633" />
    
    <!-- Middle curved band - gray -->
    <path d="M0,230 Q200,280 400,230" fill="none" stroke="#999999" stroke-width="25" />
    
    <!-- IRISH text - simplified gray -->
    <text x="200" y="300" font-family="Arial, sans-serif" font-size="100" fill="#999999" 
          text-anchor="middle" font-weight="bold" letter-spacing="5">IRISH</text>
    
    <!-- Bottom curved band - gray -->
    <path d="M0,370 Q200,320 400,370" fill="none" stroke="#999999" stroke-width="25" />
    
    <!-- Bottom S part - green -->
    <path d="M100,420 L280,420 L280,470 L360,470 L360,550 L280,630 L120,630 L40,550 L40,500 L100,500 L100,470 L230,470 L230,420 Z" fill="#006633" />
    
    <!-- Bottom octagonal outline - gray -->
    <path d="M70,400 L300,400 L300,450 L380,450 L380,550 L300,650 L100,650 L20,550 L20,450 L70,450 Z" 
          fill="none" stroke="#999999" stroke-width="20" />
  </g>
  
  <text x="50%" y="195" font-family="Arial, sans-serif" font-size="16" fill="#006633" text-anchor="middle" dominant-baseline="middle">No Image Available</text>
</svg> 